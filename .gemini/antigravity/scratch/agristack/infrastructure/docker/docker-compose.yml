services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agristack
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
    environment:
      DATABASE_URL: postgresql://agri:agri@postgres:5432/agristack
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
