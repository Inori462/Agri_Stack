<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- AgriStack Brand -->
    <title>AgriStack | Smart Farming, Shared Growth</title>
    <meta
      name="description"
      content="AgriStack empowers farmers and agricultural communities through smart farm management, shared agricultural ownership, crop monitoring, market access, and sustainable growth."
    />
    <meta
      name="keywords"
      content="AgriStack, smart farming, agriculture, crop monitoring, farmers, farm management, agricultural marketplace, shared ownership, sustainable agriculture"
    />
    <meta name="author" content="AgriStack" />
    <meta name="theme-color" content="#166534" />
    <meta name="color-scheme" content="light" />

    <!-- App Icons and PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-title"
      content="AgriStack"
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="AgriStack | Smart Farming, Shared Growth"
    />
    <meta
      property="og:description"
      content="Connect farmers, manage farms, monitor crops, and grow sustainably with AgriStack."
    />

    <!-- Global Styles -->
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #ecfdf5;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #ecfdf5;
        color: #0f172a;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: inherit;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #16a34a;
        outline-offset: 3px;
      }

      ::selection {
        background: #bbf7d0;
        color: #14532d;
      }

      #root {
        min-height: 100vh;
        isolation: isolate;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- React + Vite Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
